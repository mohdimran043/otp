# nginx sits in front of the sender: one origin for the UI and the API.
#
# That single origin is the point. The browser app calls /api/v1/... with relative URLs, so there is no
# build-time API address to get wrong, no CORS to arrange, and no second hostname to certify — and the same
# assets work behind any hostname the deployment is reachable at.
#
# It also puts the things a Go program should not be doing where they belong: TLS termination, static asset
# caching, request size limits, and the long timeouts a multi-gigabyte upload needs.

upstream sender_api {
    # The application container, over the compose network.
    #
    # It was 127.0.0.1 when nginx ran beside the API in one container, which is a stronger boundary: there
    # was no address at which the API could be reached around the proxy. Separating them costs that, and
    # buys the ability to change a proxy setting without rebuilding and redeploying the application. What
    # keeps the boundary meaningful is that the API's port is not published — from the host, this is still
    # the only way in.
    #
    # Resolved at startup rather than per request, unlike the admin backends: the application is what this
    # proxy exists to serve, so nginx refusing to start without it is the correct failure. An admin console
    # that is absent should cost its own path; an absent API means there is nothing to proxy.
    server sender:8080;
    keepalive 16;
}

# Docker's embedded DNS, for the service names below.
#
# The admin backends are separate containers, so nginx has to resolve them by name. Resolving at request time
# through a variable, rather than naming them in an upstream block, is what lets nginx *start* when they are
# not running: a static name is resolved once at load and a missing one is a fatal configuration error, which
# would mean a stopped pgAdmin takes the whole application down with it. A deployment that does not run the
# admin services should lose the admin paths and nothing else.
resolver 127.0.0.11 valid=30s ipv6=off;

# HTTPS, when a deployment supplies it.
#
# This directory is empty in development and the include matches nothing, which is not an error — so the
# stack runs on plain HTTP with no edits and no commented-out blocks to un-comment. Production drops one file
# in and gets TLS: see deploy/tls/https.conf.example for the server block, which is complete and only needs
# certificate paths.
#
# Kept out of this file deliberately rather than guarded by a variable. Certificates differ per deployment
# and per hostname, and a configuration that ships a disabled TLS block invites someone to enable it here and
# have their change overwritten by the next image build.
include /etc/nginx/tls/*.conf;

server {
    listen 80;
    server_name _;

    # The upload limit belongs here as well as in the application. nginx refuses an over-sized body before
    # it has been read, which means a mistaken 40GB upload costs one response rather than 40GB of transfer
    # into a process that was going to reject it anyway.
    client_max_body_size 64G;

    # Uploads are streamed straight through instead of being spooled to nginx's disk first. Buffering a
    # file this large would double the write volume and delay the moment the pipeline can start.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Generous, because these are the timeouts a real upload needs: a 30-gigabyte file over a slow link is
    # a single request that lasts a long time and must not be cut off.
    proxy_connect_timeout 30s;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;
    send_timeout 30m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forwarded so the application's log lines and the proxy's can be lined up against each other, which is
    # the first thing anybody wants when a request went wrong.
    proxy_set_header X-Request-Id $request_id;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The display long-poll holds a request open until the frame on screen changes, for up to 25 seconds.
    #
    # It needs its own location for two reasons. Buffering off, because the point of the endpoint is that
    # the frame reaches the viewer the instant it is published and a proxy holding it defeats that. And a
    # read timeout comfortably above the poll's own ceiling, because a request that outlives nginx's
    # patience is reported to the operator as a gateway error — which would make a working display look
    # broken.
    location = /api/v1/display/next {
        proxy_pass http://sender_api;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # Nothing about a single frame is worth logging at frame rate.
        access_log off;
    }

    location /api/ {
        proxy_pass http://sender_api;
    }

    location /health {
        proxy_pass http://sender_api;
        # Kept out of the access log: an orchestrator probes this every few seconds, and it would otherwise
        # be almost everything in there.
        access_log off;
    }

    location /metrics {
        proxy_pass http://sender_api;
        access_log off;
    }

    # MinIO's console and pgAdmin, on this origin under /minio/ and /pgadmin/. See deploy/nginx-admin.conf.
    include /etc/nginx/admin.conf;

    # The built browser app. Hashed asset filenames are immutable, so they are cached hard; index.html is
    # not, because it is what points at the current hashes.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        # Every unknown path falls through to the app, because the routes are the browser's rather than
        # nginx's: a reload of /transfers/<id> has to serve the app, not a 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
