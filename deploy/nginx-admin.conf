# The admin backends, on the application's own origin.
#
# Included by both the sender's and the receiver's nginx. MinIO's console and pgAdmin are ordinary web
# applications in their own containers; putting them behind the same proxy under a path means one address to
# reach a deployment at, one certificate to issue, and — the part that actually matters operationally — no
# extra published ports. An object store console reachable directly on 9001 is a second front door with its
# own credentials that nobody remembers to firewall.
#
# Both are proxied through a variable rather than a static upstream name, so nginx starts whether or not they
# are running. See the resolver directive in the including file for why.
#
# Neither is authenticated by nginx. They carry their own logins, and adding a second one here would mean a
# password living in an image. What this does mean is that these paths are exactly as exposed as the
# application is: a deployment reachable from the internet should either not run these services or should put
# an authenticating proxy in front of the whole origin.

# MinIO's console.
#
# The trailing slash on proxy_pass strips the /minio prefix before the request reaches the console, which is
# what it expects: unlike pgAdmin it is served from its own root and told separately, through
# MINIO_BROWSER_REDIRECT_URL, what public address to write into its own links.
#
# That variable has to match the origin this is actually reached at, and a deployment reachable at more than
# one — a local port and a tunnel, say — can only satisfy one of them. The console works either way; what
# breaks on the other origin is its redirects. Set OTP_*_MINIO_BROWSER_URL per deployment to whichever origin
# people actually use.
location /minio/ {
    set $minio_console minio:9001;
    proxy_pass http://$minio_console/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The console streams events and uses websockets for its object browser.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Uploads through the console are whole objects, so the body limit has to match the application's rather
    # than nginx's 1MB default.
    client_max_body_size 64G;
    proxy_request_buffering off;
    proxy_buffering off;
    chunked_transfer_encoding off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;
}

# pgAdmin, for looking at the database directly.
#
# SCRIPT_NAME in the container's environment is the matching half of this: pgAdmin builds its own URLs from
# it, and a mismatch between that and this location is the difference between a working console and a login
# page whose form posts to the wrong place.
location /pgadmin/ {
    set $pgadmin pgadmin:80;
    # No trailing slash and no URI part, so the original path reaches pgAdmin with its /pgadmin prefix
    # intact. That prefix is not decoration: gunicorn is configured with SCRIPT_NAME=/pgadmin and refuses,
    # with a 500 and a traceback, any request whose path does not start with it. Stripping the prefix here —
    # the usual thing to do when proxying a subpath — is exactly what breaks it.
    proxy_pass http://$pgadmin;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # pgAdmin reads this to know it is mounted under a path.
    proxy_set_header X-Script-Name /pgadmin;

    proxy_connect_timeout 10s;
    proxy_send_timeout 5m;
    proxy_read_timeout 5m;
}
