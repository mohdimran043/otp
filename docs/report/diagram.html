<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}</style></head><body><svg width="1400" height="600" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial" font-size="11">
  <rect width="700" height="300" fill="#fbfcfe"/>

  <!-- Sender machine -->
  <rect x="18" y="60" width="196" height="150" rx="5" fill="#fff" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="116" y="80" text-anchor="middle" font-weight="600" font-size="12">SENDING MACHINE</text>
  <text x="116" y="95" text-anchor="middle" fill="#6b7688" font-size="9">no network to the far side</text>
  <!-- monitor -->
  <rect x="52" y="106" width="128" height="80" rx="3" fill="#14181f"/>
  <g>
    <rect x="60" y="113" width="10" height="10" fill="#fff"/><rect x="162" y="113" width="10" height="10" fill="#fff"/>
    <rect x="60" y="166" width="10" height="10" fill="#fff"/><rect x="162" y="166" width="10" height="10" fill="#fff"/>
    <rect x="74" y="113" width="84" height="9" fill="#fff" opacity=".85"/>
    <rect x="60" y="127" width="112" height="34" fill="#e8574a" opacity=".8"/>
    <rect x="60" y="127" width="37" height="34" fill="#3fb26b" opacity=".85"/>
    <rect x="97" y="127" width="37" height="34" fill="#3d7fd6" opacity=".85"/>
    <rect x="74" y="166" width="84" height="9" fill="#fff" opacity=".85"/>
  </g>
  <text x="116" y="200" text-anchor="middle" font-size="8.5" fill="#6b7688">4K panel · one chunk per frame</text>

  <!-- optical path -->
  <path d="M 222 146 L 300 146" stroke="#c98a2b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 222 138 L 300 132" stroke="#c98a2b" stroke-width="1" opacity=".5"/>
  <path d="M 222 154 L 300 160" stroke="#c98a2b" stroke-width="1" opacity=".5"/>
  <text x="261" y="128" text-anchor="middle" font-size="9" fill="#c98a2b" font-weight="600">light</text>
  <text x="261" y="172" text-anchor="middle" font-size="8.5" fill="#6b7688">one way only</text>

  <!-- Receiver machine -->
  <rect x="308" y="60" width="196" height="150" rx="5" fill="#fff" stroke="#2f7d43" stroke-width="1.5"/>
  <text x="406" y="80" text-anchor="middle" font-weight="600" font-size="12">RECEIVING MACHINE</text>
  <text x="406" y="95" text-anchor="middle" fill="#6b7688" font-size="9">19 cores decoding in parallel</text>
  <!-- camera -->
  <rect x="360" y="112" width="52" height="36" rx="4" fill="#14181f"/>
  <circle cx="386" cy="130" r="12" fill="#2b3442" stroke="#8b95a5"/>
  <circle cx="386" cy="130" r="5" fill="#4a6fa5"/>
  <path d="M 412 122 l 22 -9 v 34 l -22 -9 z" fill="#14181f"/>
  <circle cx="366" cy="118" r="2.5" fill="#3fb26b"/>
  <text x="406" y="170" text-anchor="middle" font-size="8.5" fill="#6b7688">1920×1080 · 30 fps</text>
  <text x="406" y="184" text-anchor="middle" font-size="8.5" fill="#6b7688">decode · verify · deliver</text>

  <!-- ack return path -->
  <path d="M 406 216 L 406 248 L 116 248 L 116 216" fill="none" stroke="#2f7d43" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <rect x="212" y="236" width="196" height="24" rx="3" fill="#eaf5ec" stroke="#2f7d43" stroke-width=".8"/>
  <text x="310" y="252" text-anchor="middle" font-size="9.5" fill="#2f7d43" font-weight="600">acknowledgements — signed, out of band</text>

  <text x="350" y="286" text-anchor="middle" font-size="8.5" fill="#6b7688">
    "chunk 47 arrived intact" · the sender stops showing it and moves on
  </text>

  <text x="350" y="34" text-anchor="middle" font-size="13" font-weight="600">The whole system</text>
  <defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <path d="M0,0 L9,3.5 L0,7 z" fill="#5b6675"/></marker></defs>
</svg></body></html>
