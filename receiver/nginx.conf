# nginx sits in front of the receiver: one origin for the UI and the API.
#
# That single origin is the point. The browser app calls /api/v1/... with relative URLs, so there is no
# build-time API address to get wrong, no CORS to arrange, and no second hostname to certify — and the same
# assets work behind any hostname the deployment is reachable at.
#
# It also puts the things a Go program should not be doing where they belong: TLS termination, static asset
# caching, request size limits, and the long timeouts a multi-gigabyte upload needs.

upstream receiver_api {
    # Loopback, because the proxy and the API are the same container. That is what makes the proxy a boundary
    # rather than a suggestion: the API binds to 127.0.0.1, so there is no address at which it can be reached
    # around nginx — not from another container, and not from the host.
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # The receiver takes no uploads; the limit is here only so a malformed request cannot make it read an
    # unbounded body.
    client_max_body_size 1G;

    # Responses are streamed rather than buffered, because one of them is a merged file: spooling a
    # multi-gigabyte download through nginx's disk would double the I/O for no benefit.
    proxy_buffering off;
    proxy_http_version 1.1;

    # Generous, because the merged-file download is a single long response and a capture session's history
    # can be large.
    proxy_connect_timeout 30s;
    proxy_send_timeout 30m;
    proxy_read_timeout 30m;
    send_timeout 30m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Forwarded so the application's log lines and the proxy's can be lined up against each other, which is
    # the first thing anybody wants when a request went wrong.
    proxy_set_header X-Request-Id $request_id;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://receiver_api;
    }

    location /health {
        proxy_pass http://receiver_api;
        # Kept out of the access log: an orchestrator probes this every few seconds, and it would otherwise
        # be almost everything in there.
        access_log off;
    }

    location /metrics {
        proxy_pass http://receiver_api;
        access_log off;
    }

    # The built browser app. Hashed asset filenames are immutable, so they are cached hard; index.html is
    # not, because it is what points at the current hashes.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        # Every unknown path falls through to the app, because the routes are the browser's rather than
        # nginx's: a reload of /transfers/<id> has to serve the app, not a 404.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
