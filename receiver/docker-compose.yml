# The receiver, deployable on its own.
#
# A compose file per side is not a stylistic choice — it is what the architecture already says. The sender and
# the receiver share a protocol, a volume, and nothing else: no network call passes between them, and either
# can be restarted, upgraded, or replaced while the other keeps running. Two files make that concrete, and
# they are the two things an operator actually installs, usually on two machines that cannot reach each other
# over anything but the shared storage and a monitor pointed at a camera.

name: otp-receiver

services:
  receiver:
    build:
      # The build context is the repository root, because the image needs the shared protocol module as well
      # as this directory. That is the one thing the two applications genuinely share.
      context: ..
      dockerfile: receiver/Dockerfile
    ports:
      # Only nginx is published. The API listens on the loopback interface inside the container, so the proxy
      # is the only route to it rather than merely the recommended one.
      - "${OTP_RECEIVER_HTTP_PORT:-8081}:80"
    # See the sender's compose file for why this is here: compose reads .env for ${...} substitution
    # regardless, but that does not hand the variables to the process, so anything in .env not repeated in the
    # environment block below was silently ignored. The environment block still wins over this file.
    env_file:
      - path: .env
        required: false
    environment:
      OTP_RECEIVER_DATABASE_URL: postgres://otp:${OTP_RECEIVER_DB_PASSWORD:-otp}@postgres:5432/otp_sender?sslmode=disable

      # Both secrets have no defaults in the application, and none are invented here: a compose file that
      # supplied one would put a known signing key into every deployment that forgot to override it.
      OTP_RECEIVER_ACK_SECRET: ${OTP_RECEIVER_ACK_SECRET:?set OTP_RECEIVER_ACK_SECRET, and use the same value as the sender}
      OTP_RECEIVER_JWT_SECRET: ${OTP_RECEIVER_JWT_SECRET:?set OTP_RECEIVER_JWT_SECRET to at least 32 random bytes}

      OTP_RECEIVER_STORAGE_ROOT: /var/lib/otp/receiver
      # The display and the acknowledgement directory are the channel. In a real installation this volume is
      # the only thing both machines can reach.
      # The camera and the acknowledgement directory are the two ends of the channel from this side: frames
      # are read out of one, reports are written into the other.
      OTP_RECEIVER_CAPTURE_DIR: /var/lib/otp/shared/frames
      OTP_RECEIVER_ACK_DIR: /var/lib/otp/shared

      # Which hosts a merged file may be delivered to. There is no default, and that is deliberate: the
      # callback URL crosses the optical channel from outside this machine, so a receiver with no allowlist
      # would post files wherever the far side told it to. Empty means nothing is delivered — files still
      # arrive, are verified, and can be downloaded from the UI.
      OTP_RECEIVER_CALLBACK_ALLOWED_HOSTS: ${OTP_RECEIVER_CALLBACK_ALLOWED_HOSTS:-}
      OTP_RECEIVER_LOG_LEVEL: ${OTP_RECEIVER_LOG_LEVEL:-info}

      # Object storage instead of the local directory above, for a receiver running as more than one
      # instance. Filesystem remains the default: nothing here changes a deployment that never sets
      # OTP_RECEIVER_STORAGE_BACKEND, and the minio and minio-init services below sit idle either way —
      # compose starts them, but nothing depends on the receiver ever pointing at them.
      OTP_RECEIVER_STORAGE_BACKEND: ${OTP_RECEIVER_STORAGE_BACKEND:-filesystem}
      OTP_RECEIVER_MINIO_ENDPOINT: ${OTP_RECEIVER_MINIO_ENDPOINT:-minio:9000}
      OTP_RECEIVER_MINIO_ACCESS_KEY: ${OTP_RECEIVER_MINIO_ACCESS_KEY:-otpreceiver}
      OTP_RECEIVER_MINIO_SECRET_KEY: ${OTP_RECEIVER_MINIO_SECRET_KEY:-otpreceiver-dev-secret}
      OTP_RECEIVER_MINIO_BUCKET: ${OTP_RECEIVER_MINIO_BUCKET:-otp-receiver}
      OTP_RECEIVER_MINIO_USE_SSL: ${OTP_RECEIVER_MINIO_USE_SSL:-false}
      OTP_RECEIVER_MINIO_REGION: ${OTP_RECEIVER_MINIO_REGION:-us-east-1}
    volumes:
      - receiver-storage:/var/lib/otp/receiver
      # Bind-mounted rather than a named volume, because this is the one path an operator has to be able to
      # point at the same place on both machines — an NFS mount, a SAN share, a synced directory.
      - ${OTP_SHARED_DIR:-./shared}:/var/lib/otp/shared
      # Certificates and the HTTPS server block, when a deployment has them. The directory is empty
      # in development and nginx's include globs it to nothing, so this mount changes nothing until
      # something is put in it. See deploy/tls/https.conf.example.
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        # Not service_healthy: minio-init is a one-shot that sets an alias and makes a bucket, and
        # completing is the whole of its job. Gating on that rather than on a healthcheck against minio
        # itself means the receiver only starts once the bucket it might be told to use actually exists —
        # whether or not this deployment ever asks for the minio backend.
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Readiness rather than liveness, because this is what a load balancer should gate on: the process
      # being up is not the same as it being able to serve.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otp
      POSTGRES_PASSWORD: ${OTP_RECEIVER_DB_PASSWORD:-otp}
      POSTGRES_DB: otp_sender
    volumes:
      - receiver-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otp -d otp_sender"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The object storage backend, present whether or not this deployment uses it. Pinned to a
  # specific release rather than "latest": an object store an operator did not choose to upgrade
  # should not upgrade itself under them the next time the stack is brought up.
  minio:
    # There is no minio/minio release tagged 2024-11-17: minio and mc are versioned and released
    # independently, and the November release nearest that mc pin is this one.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OTP_RECEIVER_MINIO_ACCESS_KEY:-otpreceiver}
      MINIO_ROOT_PASSWORD: ${OTP_RECEIVER_MINIO_SECRET_KEY:-otpreceiver-dev-secret}
      # Where the console is reached from the outside, which it needs in order to write its own links.
      # nginx serves it under /minio on the application's origin; this is the same address said again, and
      # the two have to agree. A deployment reached at more than one origin can only name one here.
      MINIO_BROWSER_REDIRECT_URL: ${OTP_RECEIVER_MINIO_BROWSER_URL:-http://localhost:2000/minio}
    volumes:
      - receiver-minio:/data
    restart: unless-stopped

  # A one-shot, not a healthcheck on minio itself. minio has nothing to authenticate an
  # unauthenticated probe against — an alias has to be set with real credentials before "is it
  # ready" can even be asked — so the thing worth waiting on is this container succeeding at that,
  # and then at making the bucket the receiver expects, rather than the server merely answering.
  # It exits once both are done, which is what the receiver's depends_on below waits for.
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${OTP_RECEIVER_MINIO_ACCESS_KEY:-otpreceiver}
      MINIO_ROOT_PASSWORD: ${OTP_RECEIVER_MINIO_SECRET_KEY:-otpreceiver-dev-secret}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio"
          sleep 1
        done
        mc mb -p local/otp-receiver

  # pgAdmin, reachable at /pgadmin on the application's own origin.
  #
  # Not published on a port of its own, deliberately. It reaches Postgres over the compose network, which is
  # the only thing that can — the database has never been published and still is not — so the whole of its
  # exposure is the path nginx gives it, and a deployment that wants it gone removes this service and loses
  # that path and nothing else.
  #
  # SCRIPT_NAME is what makes the subpath work: pgAdmin builds its own URLs from it, and without it the login
  # page loads and posts to the origin root. It has to agree with the location block in deploy/nginx-admin.conf.
  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      # Development credentials, and named as such. pgAdmin refuses to start without them, so there is no
      # option to leave them unset — which makes overriding them in .env the thing to do before this is
      # reachable from anywhere but a laptop.
      #
      # example.com rather than something like otp.local: pgAdmin validates the address against real TLDs
      # even with deliverability checking off, and rejects .local by restarting forever with the reason on
      # stdout and nothing on the page.
      PGADMIN_DEFAULT_EMAIL: ${OTP_RECEIVER_PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${OTP_RECEIVER_PGADMIN_PASSWORD:-otp-dev-password}
      SCRIPT_NAME: /pgadmin
      # The setup wizard asks for a master password on every login otherwise, which is friction with no
      # security value on a console that is already behind its own login.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # pgAdmin checks the Host header against its own idea of where it is; behind a proxy that check fails
      # every request. nginx forwards the real host, so the check is redundant here rather than skipped.
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
    volumes:
      - receiver-pgadmin:/var/lib/pgadmin
      # The server is pre-registered so the console opens on this deployment's database rather than on an
      # empty list and a form asking for a hostname the operator has to know.
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  receiver-storage:
  receiver-postgres:
  receiver-minio:
  receiver-pgadmin:
